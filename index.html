<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Playground</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://unpkg.com/tone"></script>
    <script type="module" src="js/main.js" defer></script>
</head>


<body>
<main class="app">
    <!-- Global navigation -->
    <nav class="navigation">
        <button id="nav-back" class="icon-button" hidden>
            <img src="assets/icon/back.png" alt="back"/>
        </button>
        <div class="nav-right">
            <button id="volume" class="icon-button">
                <img src="assets/icon/volume-on.png" alt="volume"/>
            </button>
        </div>
    </nav>

    <!-- Welcome screen -->
    <section id="welcome" class="screen welcome">
        <h1>PopNotes</h1>
        <button class="start-button" data-screen="home">
            <img src="assets/icon/start.png" alt="start" />
        </button>
        <p class="start-label">Tap Play</p>
    </section>

    <!-- Mode selection -->
    <section id="home" class="screen home" hidden>
        <div class="mode-options">
            <button class="mode-button" data-screen="freeplay">
                <span class="mode-circle">
                    <img src="assets/icon/play-mode-icon.png" alt="free play mode"/>
                </span>
                <span class="mode-label">Play</span>
            </button>
            <button class="mode-button" data-screen="choose">
                <span class="mode-circle">
                    <img src="assets/icon/learning-mode-icon.png" alt="learning mode"/>
                </span>
                <span class="mode-label">Learn</span>
            </button>
        </div>
        <!-- I use friendly characters throughout the guides to make the app feel playful and interactive. They might give young children someone familiar to follow and help the experience feel less intimidating. -->
        <div class="home-guide home-guide-intro">
            <!-- I start with a welcome message to make the app feel friendly and set the tone for what comes next. -->
            <div class="speech-bubble speech-welcome">Welcome</div>
            <img class="guide-character guide-character-intro" src="assets/character/character-1.png" alt="" />
            <!-- Every guide has a Skip button because toddlers learn at different speeds. Help should be available when they want it, rather than forced on everyone. -->
            <button class="guide-skip" type="button">Skip</button>
        </div>
        <div class="home-guide home-guide-choice">
            <div class="speech-bubble speech-choice">choose one<br />to try!</div>
            <img class="guide-character guide-character-choice" src="assets/character/character-2.png" alt="" />
        </div>
        <img class="guide-hand" src="assets/icon/hand-cursor.png" alt="hand cursor" />
    </section>

    <!-- Song library -->
    <section id="choose" class="screen choose" hidden>
        <img class="choice-icon" src="assets/icon/choice.png" alt="song-options"/>
        <div id="song-options" class="song-options"></div>
        <div class="choose-guidance" hidden>
            <div class="learning-guide-title">1. Choose a song</div>
            <div class="learning-guide-progress" aria-hidden="true"></div>
            <button class="learning-guide-skip" type="button">× Skip</button>
            <img class="learning-guide-character choose-guide-character" src="assets/character/character-7.png" alt="character-7" />
            <img class="learning-guide-hand choose-guide-hand" src="assets/icon/hand-cursor.png" alt="hand cursor" />
        </div>
    </section>

    <!-- Free play -->
    <section id="freeplay" class="screen performance" hidden>
        <div class="instrument">
            <svg class="instrument-body" viewBox="0 0 1080 780" preserveAspectRatio="none">
                <path
                        d="M0 300C0 130 145 0 330 0C490 0 495 125 735 125H855Q1080 110 1080 290V710Q1080 780 1010 780H70Q0 780 0 710Z"
                />
            </svg>
            <div class="instrument-controls">
                <button id="change-colors" class="control-tab" title="Shuffle key colors">
                    <img class="change-icon" src="assets/icon/change.png" alt="random"/>
                    <img class="palette-icon" src="assets/icon/color-palette.png" alt="color palette"/>
                </button>
                <div class="voice-options">
                    <button data-voice="piano" class="is-selected">
                        <svg
                                class="voice-shape"
                                viewBox="0 0 180 140"
                                preserveAspectRatio="none"
                        >
                            <path
                                    d="M12 134 Q4 134 8 122 L36 44 Q48 8 83 7 Q123 3 161 10 Q178 14 172 34 L145 117 Q141 134 125 134 Z"
                            />
                        </svg>
                        <img src="assets/icon/piano.png" alt="piano"/>
                    </button>
                    <button data-voice="xylophone">
                        <svg
                                class="voice-shape"
                                viewBox="0 0 180 140"
                                preserveAspectRatio="none"
                        >
                            <path
                                    d="M8 134 L42 10 Q89 19 132 65 Q160 91 173 113 Q185 134 162 134 Z"
                            />
                        </svg>
                        <img src="assets/icon/xylophone.png" alt="xylophone"/>
                    </button>
                </div>
            </div>
            <div id="free-canvas" class="music-canvas"></div>
            <div class="keyboard"></div>
        </div>
        <div class="freeplay-onboarding" hidden>
            <div class="freeplay-step-title"></div>
            <div class="freeplay-progress" aria-hidden="true"></div>
            <button class="freeplay-skip" type="button">× Skip</button>
            <div class="freeplay-highlight"></div>
            <!-- Step 1 shows the full keyboard before I introduce the Show Keyboard Letters button. This makes the correct keyboard row and its piano-key mapping clear from the start. -->
            <div class="freeplay-key-hint">
                <img src="assets/icon/keyboard-example.png" alt="" />
                <span class="freeplay-key-hint-frame"></span>
            </div>
            <img class="freeplay-guide-character" src="assets/character/character-3.png" alt="guide character" />
            <img class="freeplay-guide-hand" src="assets/icon/hand-cursor.png" alt="guide hand cursor" />
            <div class="freeplay-complete-card">
                <div class="freeplay-complete-image">
                    <img src="assets/character/character-6.png" alt="celebrate character" />
                </div>
                <div class="freeplay-complete-content">
                    <span class="freeplay-complete-text">Try Playing!</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Learning performance -->
    <section id="learning" class="screen performance" hidden>
        <div class="instrument">
            <svg
                    class="instrument-body"
                    viewBox="0 0 1080 780"
                    preserveAspectRatio="none"
            >
                <path
                        d="M0 300C0 130 145 0 330 0C490 0 495 125 735 125H855Q1080 110 1080 290V710Q1080 780 1010 780H70Q0 780 0 710Z"
                />
            </svg>
            <div class="instrument-controls">
                <button
                        id="song-library"
                        class="control-tab"
                        data-screen="choose"
                        title="Choose a song"
                >
                    <img src="assets/icon/songs.png" alt="Choose a song"/>
                </button>
            </div>
            <div class="song-stand">
                <img id="selected-icon" src="assets/icon/star.png" alt="Twinkle Twinkle"/>
                <span id="selected-title">Twinkle Twinkle</span>
            </div>
            <div class="music-canvas learning-canvas">
                <div id="note-guide" class="note-guide"></div>
                <button id="demo" class="demo-button">♫</button>
                <p id="learning-status">Play the highlighted key</p>
                <!-- Keep completion content in the existing panel with navigation available. -->
                <div id="completion" class="completion" hidden>
                    <img id="completion-icon" src="assets/icon/so-good.png" alt="so good"/>
                    <div class="completion-content">
                        <h3 id="completion-title">So Good!</h3>
                        <div class="completion-actions">
                            <button id="completion-songs" title="Choose another song">
                                <img src="assets/icon/songs.png" alt="Choose another song"/>
                            </button>
                            <button id="restart" title="Play again">
                            <img src="assets/icon/change.png" alt="Play again"/>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="keyboard"></div>
        </div>
        <div class="learning-onboarding" hidden>
            <div class="learning-guide-title"></div>
            <div class="learning-guide-progress" aria-hidden="true"></div>
            <button class="learning-guide-skip" type="button">× Skip</button>
            <img class="learning-guide-character performance-guide-character" src="assets/character/character-7.png" alt="" />
            <img class="learning-guide-hand performance-guide-hand" src="assets/icon/hand-cursor.png" alt="hand cursor" />
            <div class="learning-guide-key-frame"></div>
            <div class="learning-library-target">
                <button type="button"><img src="assets/icon/star.png" alt="" /></button>
                <button type="button"><img src="assets/icon/clap.png" alt="" /></button>
                <button type="button"><img src="assets/icon/happy.png" alt="" /></button>
                <button class="learning-library-confirm" type="button" aria-label="Complete music library guide">
                    <img src="assets/icon/complete.png" alt="" />
                </button>
            </div>
            <div class="learning-complete-card">
                <img src="assets/character/character-10.png" alt="" />
                <span>Try Playing!</span>
            </div>
        </div>
    </section>
    <p id="audio-status" class="audio-status" hidden></p>
</main>
</body>
</html>
